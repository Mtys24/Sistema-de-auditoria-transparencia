<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría · Transparencia Activa Municipal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ok: #00c896;
    --ok-bg: #00c89615;
    --warn: #f5a623;
    --warn-bg: #f5a62315;
    --bad: #ff4d4d;
    --bad-bg: #ff4d4d15;
    --bg: #0c0e14;
    --surface: #13161f;
    --surface2: #1a1e2b;
    --border: #ffffff10;
    --border2: #ffffff20;
    --text: #eef0f8;
    --muted: #6e7491;
    --accent: #5b7fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 48px;
    gap: 24px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1px;
    color: var(--text);
  }

  .header-left h1 span {
    color: var(--accent);
  }

  .header-left p {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .badge-org {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* METRICS */
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color .2s;
  }

  .metric:hover { border-color: var(--accent); }

  .metric::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .metric.ok::after { background: var(--ok); }
  .metric.warn::after { background: var(--warn); }
  .metric.bad::after { background: var(--bad); }
  .metric.total::after { background: var(--accent); }

  .metric-num {
    font-family: 'Syne', sans-serif;
    font-size: 42px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 6px;
  }

  .metric.ok .metric-num { color: var(--ok); }
  .metric.warn .metric-num { color: var(--warn); }
  .metric.bad .metric-num { color: var(--bad); }
  .metric.total .metric-num { color: var(--accent); }

  .metric-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* CHART BAR */
  .progress-bar {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 40px;
  }

  .progress-bar h2 {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .bar-track {
    height: 10px;
    background: var(--surface2);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    margin-bottom: 12px;
  }

  .bar-seg {
    height: 100%;
    transition: width 1s cubic-bezier(.4,0,.2,1);
  }

  .bar-legend {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    width: 14px;
    height: 14px;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 10px 12px 10px 36px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .filter-btns {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transition: all .2s;
  }

  .btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
  .btn.active-all { border-color: var(--accent); color: var(--accent); background: #5b7fff12; }
  .btn.active-ok { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
  .btn.active-warn { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
  .btn.active-bad { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }

  /* RESULTS COUNT */
  .results-count {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ITEMS */
  .items { display: flex; flex-direction: column; gap: 6px; }

  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color .2s, background .2s;
    animation: fadeIn .25s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .item:hover { border-color: var(--border2); }
  .item.open { border-color: var(--border2); background: var(--surface2); }

  .item-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
  }

  .status-line {
    width: 3px;
    height: 20px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .item-name {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
  }

  .tag {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    padding: 3px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tag-ok   { background: var(--ok-bg);   color: var(--ok);   border: 1px solid #00c89630; }
  .tag-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #f5a62330; }
  .tag-bad  { background: var(--bad-bg);  color: var(--bad);  border: 1px solid #ff4d4d30; }

  .chevron {
    width: 16px;
    height: 16px;
    color: var(--muted);
    transition: transform .25s;
    flex-shrink: 0;
  }

  .item.open .chevron { transform: rotate(180deg); }

  .item-body {
    display: none;
    padding: 0 18px 16px 35px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    border-top: 1px solid var(--border);
  }

  .item.open .item-body { display: block; }

  .areas {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .area-pill {
    font-size: 10px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 2px 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .prev-obs {
    margin-top: 10px;
    padding: 10px 12px;
    background: #ff4d4d08;
    border-left: 2px solid var(--bad);
    border-radius: 0 4px 4px 0;
    font-size: 11px;
    color: #ff4d4d80;
  }

  .prev-obs span {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--bad);
    margin-bottom: 4px;
    opacity: .7;
  }

  .no-results {
    text-align: center;
    padding: 60px 0;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }

  .no-results.show { display: block; }

  /* FOOTER */
  .footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  @media (max-width: 640px) {
    .metrics { grid-template-columns: 1fr 1fr; }
    .header-left h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-left">
      <h1>Auditoría<br><span>Transparencia</span></h1>
      <p>Municipio · Revisión 2026 · 37 ítems</p>
    </div>
    <div class="badge-org">Consejo para la<br>Transparencia</div>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="progress-bar">
    <h2>Cumplimiento global</h2>
    <div class="bar-track" id="bar-track">
      <div class="bar-seg" id="seg-ok"  style="background:var(--ok);width:0%"></div>
      <div class="bar-seg" id="seg-warn" style="background:var(--warn);width:0%"></div>
      <div class="bar-seg" id="seg-bad" style="background:var(--bad);width:0%"></div>
    </div>
    <div class="bar-legend" id="bar-legend"></div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="search" placeholder="Buscar ítem...">
    </div>
    <div class="filter-btns" id="filters"></div>
  </div>

  <div class="results-count" id="count"></div>
  <div class="items" id="grid"></div>
  <div class="no-results" id="no-results">Sin resultados para esa búsqueda.</div>

  <div class="footer">
    <span>Auditoría de Transparencia Activa · 2026</span>
    <span id="footer-date"></span>
  </div>
</div>

<script>
const ITEMS = [
  {name:"Actos y documentos en Diario Oficial",status:"warn",tag:"Incompleto",detail:"Falta publicación de enero y febrero 2026.",prev:null,areas:["Municipal"]},
  {name:"Potestades y atribuciones del organismo",status:"ok",tag:"Completado",detail:"Información disponible y al día.",prev:null,areas:["Municipal"]},
  {name:"Marco normativo",status:"ok",tag:"Completado",detail:"Publicado correctamente.",prev:null,areas:["Municipal"]},
  {name:"Facultades de unidades internas",status:"ok",tag:"Completado",detail:"Información completa.",prev:null,areas:["Municipal"]},
  {name:"Organigrama",status:"ok",tag:"Completado",detail:"Publicado correctamente.",prev:null,areas:["Municipal"]},
  {name:"Estructura orgánica de Transparencia y Protección de Datos",status:"bad",tag:"No creado",detail:"No está publicado en la página de Transparencia Activa.",prev:"Auditoría anterior detectó infracción al art. 5° de la Resolución Exenta N°500. Información no disponible.",areas:["Municipal"]},
  {name:"Personal de planta",status:"warn",tag:"Incompleto",detail:"Municipal y Salud faltan datos de marzo. Educación sí cuenta con marzo.",prev:null,areas:["Municipal","Salud","Educación"]},
  {name:"Personal a contrata",status:"warn",tag:"Incompleto",detail:"Municipal y Salud faltan datos de marzo. Educación sí cuenta con marzo.",prev:null,areas:["Municipal","Salud","Educación"]},
  {name:"Personal sujeto al Código del Trabajo",status:"warn",tag:"Incompleto",detail:"Municipal y Salud faltan datos de marzo. En Educación el departamento existe, pero Jardines VTF falta febrero y marzo.",prev:null,areas:["Municipal","Salud","Educación"]},
  {name:"Personas naturales contratadas a honorarios",status:"bad",tag:"Incompleto",detail:"Municipal y Salud faltan datos de marzo. Educación no tiene publicado el año 2026.",prev:"Auditoría anterior: información desactualizada en educación. Incumplimiento art. 5° y 102° de la Resolución N°500.",areas:["Municipal","Salud","Educación"]},
  {name:"Escalas de remuneraciones",status:"ok",tag:"Completado",detail:"Información disponible y al día.",prev:null,areas:["Municipal"]},
  {name:"Información estadística sobre bonificaciones",status:"warn",tag:"Incompleto",detail:"Municipal y Salud faltan datos de marzo.",prev:null,areas:["Municipal","Salud"]},
  {name:"Autoridades de elección popular o designación",status:"ok",tag:"Completado",detail:"Publicado correctamente.",prev:null,areas:["Municipal"]},
  {name:"Adquisiciones en Sistema de Compras Públicas",status:"warn",tag:"Incompleto",detail:"Link a Mercado Público funciona. Licitaciones: Municipal (ene/mar) y Educación (mar) faltan 2026. Salud completo.",prev:null,areas:["Municipal","Educación","Salud"]},
  {name:"Contrataciones fuera de Compras Públicas — bienes y servicios",status:"ok",tag:"Completado",detail:"Corregido tras auditoría anterior donde no estaba publicado.",prev:null,areas:["Municipal"]},
  {name:"Contrataciones fuera de Compras Públicas — menores a 3 UTM",status:"warn",tag:"Con dudas",detail:"El ítem existe pero puede no estar vinculado correctamente (¿cajas chicas?). Faltan datos de marzo en las 3 áreas.",prev:"Auditoría anterior: el enlace no dirigía a información correcta. Incumplimiento art. 5° de la Resolución N°500.",areas:["Municipal","Salud","Educación"]},
  {name:"Contratos formalizados por orden de compra",status:"bad",tag:"No encontrado",detail:"Al parecer no está en la página.",prev:"Auditoría anterior: ausencia de información de educación y falta de mensaje de período sin datos. Incumplimiento art. 5° y 102° de la Resolución N°500.",areas:["Municipal","Educación"]},
  {name:"Contrataciones relativas a bienes inmuebles",status:"warn",tag:"Revisar",detail:"Aparece completa, pero verificar vigencia de la información.",prev:"Auditoría anterior: datos desactualizados al mes de enero de 2025. Incumplimiento art. 5° y 102° de la Resolución N°500.",areas:["Municipal"]},
  {name:"Transferencias Ley N°19.862",status:"warn",tag:"Revisar link",detail:"Enlace con comportamiento raro al momento de revisión.",prev:"Auditoría anterior reportó error 404 al ingresar.",areas:["Municipal"]},
  {name:"Otras transferencias",status:"bad",tag:"Sin datos 2026",detail:"No hay información del año 2026.",prev:"Auditoría anterior: datos desactualizados a febrero de 2025. Incumplimiento art. 5° y 102° de la Resolución N°500.",areas:["Municipal"]},
  {name:"Actos y resoluciones con efectos sobre terceros",status:"warn",tag:"Parcial",detail:"Sub-ítems incompletos: Compra trato directo, Órdenes de Pago, Propuesta Privada/Pública, Recepción Definitiva/Provisoria, Subsidios y Beneficios, Traspaso de Fondos. Decretos de Pago: falta Municipal y Educación 2026. Patentes Comerciales/Profesionales/Otros: incompletas.",prev:null,areas:["Municipal","Educación","Salud"]},
  {name:"Trámites y requisitos para acceso a servicios",status:"warn",tag:"Sin confirmar",detail:"Duda sobre si el ítem está efectivamente creado.",prev:null,areas:["Municipal"]},
  {name:"Subsidios y beneficios propios",status:"bad",tag:"Incompleto",detail:"Faltan sub-ítems de 2026 en Subsidios Propios y como Intermediario.",prev:null,areas:["Municipal"]},
  {name:"Nómina de beneficiarios",status:"bad",tag:"Incompleto",detail:"Faltan sub-ítems de 2026 en todas las sub-carpetas.",prev:null,areas:["Municipal"]},
  {name:"Mecanismos de participación ciudadana",status:"warn",tag:"Parcial",detail:"Norma general completada. Actas Consejo de Seguridad Pública falta 2026. Actas Oficina Local de la Niñez falta 2025 y 2026.",prev:null,areas:["Municipal"]},
  {name:"Consejos consultivos",status:"bad",tag:"No creado",detail:"Ítem no creado en Transparencia Activa.",prev:"Auditoría anterior: información desactualizada al año 2024. Incumplimiento art. 5° y 102° de la Resolución N°500.",areas:["Municipal"]},
  {name:"Norma de participación ciudadana",status:"ok",tag:"Completado",detail:"Publicada correctamente.",prev:null,areas:["Municipal"]},
  {name:"Mecanismos de participación en ejecución",status:"warn",tag:"Incompleto",detail:"Falta información del año 2026.",prev:null,areas:["Municipal"]},
  {name:"Presupuesto asignado municipal",status:"warn",tag:"Parcial",detail:"Vehículos: solo Salud tiene datos. Educación falta marzo en múltiples sub-ítems: Balance de ejecución, Estado financiero, Libro diario, Pasivos, Variaciones, etc.",prev:null,areas:["Municipal","Salud","Educación"]},
  {name:"Ejecución presupuestaria",status:"warn",tag:"Revisar estructura",detail:"Los ítems están creados dentro del ítem de Presupuesto Asignado en lugar de estar como sección independiente.",prev:null,areas:["Municipal"]},
  {name:"Auditorías al ejercicio presupuestario",status:"warn",tag:"Parcial",detail:"Auditorías de Contraloría: completas. Auditorías internas (Dir. Control Interna): falta 2026.",prev:null,areas:["Municipal"]},
  {name:"Vínculos con otras entidades",status:"ok",tag:"Completado",detail:"Referencia completa disponible.",prev:null,areas:["Municipal"]},
  {name:"Informe Anual Subdere",status:"bad",tag:"No encontrado",detail:"No se encuentra creado en la página de Transparencia Activa.",prev:null,areas:["Municipal"]},
  {name:"Índice de actos secretos o reservados",status:"ok",tag:"Completado",detail:"Publicado correctamente.",prev:null,areas:["Municipal"]},
  {name:"Sanciones conforme Título VI Ley de Transparencia",status:"warn",tag:"Sin datos 2026",detail:"Ítem creado pero sin información para el año 2026.",prev:null,areas:["Municipal"]},
  {name:"Obligaciones Ley N°20.880",status:"ok",tag:"Completado",detail:"Publicada correctamente.",prev:null,areas:["Municipal"]},
  {name:"Obligaciones Ley N°20.730",status:"bad",tag:"No encontrado",detail:"No se encuentra en la página de Transparencia Activa.",prev:null,areas:["Municipal"]}
];

const total = ITEMS.length;
const counts = { ok: 0, warn: 0, bad: 0 };
ITEMS.forEach(i => counts[i.status]++);

// Metrics
const metricData = [
  { cls:'total', num: total, label: 'Ítems fiscalizados' },
  { cls:'ok',    num: counts.ok,   label: 'Completados' },
  { cls:'warn',  num: counts.warn, label: 'Incompletos' },
  { cls:'bad',   num: counts.bad,  label: 'No disponibles' }
];

document.getElementById('metrics').innerHTML = metricData.map(m =>
  `<div class="metric ${m.cls}">
    <div class="metric-num">${m.num}</div>
    <div class="metric-label">${m.label}</div>
  </div>`
).join('');

// Progress bar
setTimeout(() => {
  document.getElementById('seg-ok').style.width   = (counts.ok   / total * 100).toFixed(1) + '%';
  document.getElementById('seg-warn').style.width = (counts.warn / total * 100).toFixed(1) + '%';
  document.getElementById('seg-bad').style.width  = (counts.bad  / total * 100).toFixed(1) + '%';
}, 100);

document.getElementById('bar-legend').innerHTML = [
  { color: 'var(--ok)',   label: `Completado — ${counts.ok} (${Math.round(counts.ok/total*100)}%)` },
  { color: 'var(--warn)', label: `Incompleto — ${counts.warn} (${Math.round(counts.warn/total*100)}%)` },
  { color: 'var(--bad)',  label: `No disponible — ${counts.bad} (${Math.round(counts.bad/total*100)}%)` }
].map(l =>
  `<div class="legend-item"><div class="legend-dot" style="background:${l.color}"></div><span>${l.label}</span></div>`
).join('');

// Filters
let activeFilter = 'all';
let searchVal = '';

const filterConfig = [
  { k:'all',  label:'Todos', active:'active-all' },
  { k:'ok',   label:'Completado', active:'active-ok' },
  { k:'warn', label:'Incompleto', active:'active-warn' },
  { k:'bad',  label:'No disponible', active:'active-bad' }
];

function renderFilters() {
  document.getElementById('filters').innerHTML = filterConfig.map(f =>
    `<button class="btn ${activeFilter === f.k ? f.active : ''}" data-filter="${f.k}">${f.label}</button>`
  ).join('');
  document.querySelectorAll('[data-filter]').forEach(btn =>
    btn.addEventListener('click', () => { activeFilter = btn.dataset.filter; renderAll(); })
  );
}

function renderGrid() {
  const filtered = ITEMS.filter(item => {
    const matchF = activeFilter === 'all' || item.status === activeFilter;
    const matchS = !searchVal || item.name.toLowerCase().includes(searchVal);
    return matchF && matchS;
  });

  document.getElementById('count').textContent = `Mostrando ${filtered.length} de ${total} ítems`;

  const noRes = document.getElementById('no-results');
  if (filtered.length === 0) {
    document.getElementById('grid').innerHTML = '';
    noRes.classList.add('show');
    return;
  }
  noRes.classList.remove('show');

  document.getElementById('grid').innerHTML = filtered.map((item, i) => `
    <div class="item" id="item-${i}" style="animation-delay:${Math.min(i * 0.03, 0.3)}s">
      <div class="item-header" onclick="toggle('item-${i}')">
        <div class="status-line" style="background:var(--${item.status})"></div>
        <div class="item-name">${item.name}</div>
        <div class="tag tag-${item.status}">${item.tag}</div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="item-body">
        <div style="padding-top:12px">${item.detail}</div>
        ${item.prev ? `<div class="prev-obs"><span>Observación previa</span>${item.prev}</div>` : ''}
        <div class="areas">${item.areas.map(a => `<span class="area-pill">${a}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

function toggle(id) {
  document.getElementById(id).classList.toggle('open');
}

function renderAll() {
  renderFilters();
  renderGrid();
}

document.getElementById('search').addEventListener('input', e => {
  searchVal = e.target.value.toLowerCase();
  renderAll();
});

document.getElementById('footer-date').textContent = new Date().toLocaleDateString('es-CL', { year: 'numeric', month: 'long', day: 'numeric' });

renderAll();
</script>
</body>
</html>
