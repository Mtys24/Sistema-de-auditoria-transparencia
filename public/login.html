<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Auditoría</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e14; --surface: #13161f; --surface2: #1a1e2b;
    --border: #ffffff10; --border2: #ffffff20; --text: #eef0f8;
    --muted: #6e7491; --accent: #5b7fff; --bad: #ff4d4d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(var(--border) 1px,transparent 1px), linear-gradient(90deg,var(--border) 1px,transparent 1px);
    background-size: 48px 48px; pointer-events: none; z-index: 0;
  }
  .card {
    position: relative; z-index: 1;
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 14px; padding: 40px; width: 100%; max-width: 380px;
  }
  h1 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 4px; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 32px; }
  label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px; outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }
  .btn-submit {
    width: 100%; margin-top: 28px; background: var(--accent); border: none;
    border-radius: 8px; padding: 12px; font-family: 'DM Mono', monospace;
    font-size: 13px; color: #fff; cursor: pointer; font-weight: 500;
    transition: opacity .2s;
  }
  .btn-submit:hover { opacity: .85; }
  .error { margin-top: 14px; font-size: 12px; color: var(--bad); display: none; }
  .error.show { display: block; }
  .back { margin-top: 20px; text-align: center; font-size: 11px; color: var(--muted); }
  .back a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Auditoría<br><span>Sistema</span></h1>
  <p class="subtitle">Acceso restringido</p>
  <form id="form">
    <label>Usuario</label>
    <input type="text" id="username" autocomplete="username" required>
    <label>Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button class="btn-submit" type="submit">Ingresar</button>
    <p class="error" id="error"></p>
  </form>
  <p class="back"><a href="/">← Volver al dashboard público</a></p>
</div>
<script>
  if (localStorage.getItem('token')) {
    const role = localStorage.getItem('role');
    window.location.href = role === 'admin' ? '/admin.html' : '/panel.html';
  }

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('error');
    err.classList.remove('show');
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || 'Error al iniciar sesión';
      err.classList.add('show');
      return;
    }
    localStorage.setItem('token', data.token);
    localStorage.setItem('role', data.role);
    localStorage.setItem('username', data.username);
    window.location.href = data.role === 'admin' ? '/admin.html' : '/panel.html';
  });
</script>
</body>
</html>
