<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría Transparencia · Portal Público</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ok: #00c896;
    --ok-bg: rgba(0, 200, 150, 0.1);
    --warn: #f5a623;
    --warn-bg: rgba(245, 166, 35, 0.1);
    --bad: #ff4d4d;
    --bad-bg: rgba(255, 77, 77, 0.1);
    --bg: #0c0e14;
    --surface: #13161f;
    --surface2: #1a1e2b;
    --border: rgba(255, 255, 255, 0.05);
    --border2: rgba(255, 255, 255, 0.1);
    --text: #eef0f8;
    --muted: #6e7491;
    --accent: #5b7fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  /* TOP BUTTONS */
  .top-right {
    position: absolute;
    top: 40px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
  }
  .tr-btn {
    background: transparent;
    border: 1px solid var(--border2);
    padding: 6px 14px;
    border-radius: 4px;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-decoration: none;
    transition: all 0.3s;
  }
  .tr-btn:hover { border-color: var(--accent); color: var(--text); background: rgba(91, 127, 255, 0.05); }

  /* HEADER */
  .header { margin-bottom: 60px; }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 64px;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -2px;
    color: #fff;
    margin-bottom: 10px;
  }
  .header h1 span {
    display: block;
    color: var(--accent);
  }
  .header p {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* METRICS */
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 40px;
  }
  .metric {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 30px 20px;
    text-align: center;
    position: relative;
    transition: transform 0.3s;
  }
  .metric:hover { transform: translateY(-5px); border-color: var(--accent); }
  .metric-num {
    font-family: 'Syne', sans-serif;
    font-size: 48px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 8px;
    color: var(--text);
  }
  .metric-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .metric.ok .metric-num { color: var(--ok); }
  .metric.warn .metric-num { color: var(--warn); }
  .metric.bad .metric-num { color: var(--bad); }

  /* CUMPLIMIENTO GLOBAL */
  .global-progress {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 50px;
  }
  .gp-title {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-bottom: 20px;
  }
  .gp-track {
    height: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    margin-bottom: 20px;
  }
  .gp-seg { height: 100%; transition: width 1s ease-out; }
  .gp-legend { display: flex; gap: 30px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* SEARCH & FILTERS */
  .controls {
    display: flex;
    gap: 15px;
    margin-bottom: 40px;
    align-items: center;
    background: var(--surface);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid var(--border2);
  }
  .search-wrap { position: relative; flex: 1; }
  .search-input {
    width: 100%;
    background: transparent;
    border: none;
    padding: 10px 15px 10px 40px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    outline: none;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    width: 18px;
  }
  .filter-btns { display: flex; gap: 8px; }
  .fbtn {
    background: transparent;
    border: 1px solid var(--border2);
    padding: 8px 16px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .fbtn:hover { border-color: var(--text); color: var(--text); }
  .fbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ITEMS LIST */
  .results-info { font-size: 10px; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.1em; }
  .items { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .item:hover { background: rgba(255,255,255,0.04); border-color: var(--border2); transform: translateX(5px); }
  .item-content { flex: 1; }
  .item-name { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .item-meta { font-size: 10px; color: var(--muted); }
  .item-status { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  .item-status.ok { color: var(--ok); }
  .item-status.warn { color: var(--warn); }
  .item-status.bad { color: var(--bad); }
  
  .chevron { width: 14px; color: var(--muted); transition: transform 0.3s; }

  @media (max-width: 768px) {
    .metrics { grid-template-columns: 1fr 1fr; }
    .header h1 { font-size: 40px; }
    .controls { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-right">
    <a href="#" class="tr-btn">Consejo para la Transparencia</a>
    <a href="/login.html" class="tr-btn">Acceso auditor</a>
  </div>

  <header class="header">
    <h1>Auditoria<br><span>Transparencia</span></h1>
    <p id="header-subtitle">MUNICIPIO - REVISION 2026 - 0 ITEMS</p>
  </header>

  <div class="metrics" id="metrics">
    <div class="metric"><div class="metric-num">—</div><div class="metric-label">Ítems Fiscalizados</div></div>
    <div class="metric ok"><div class="metric-num">—</div><div class="metric-label">Completados</div></div>
    <div class="metric warn"><div class="metric-num">—</div><div class="metric-label">Incompletos</div></div>
    <div class="metric bad"><div class="metric-num">—</div><div class="metric-label">No Disponibles</div></div>
  </div>

  <div class="global-progress">
    <div class="gp-title">Cumplimiento Global</div>
    <div class="gp-track">
      <div class="gp-seg" id="seg-ok" style="background:var(--ok); width:0%"></div>
      <div class="gp-seg" id="seg-warn" style="background:var(--warn); width:0%"></div>
      <div class="gp-seg" id="seg-bad" style="background:var(--bad); width:0%"></div>
    </div>
    <div class="gp-legend" id="gp-legend"></div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="search" placeholder="Buscar ítem...">
    </div>
    <div class="filter-btns" id="filters">
      <button class="fbtn active" onclick="setFilter('all')">Todos</button>
      <button class="fbtn" onclick="setFilter('ok')">Completado</button>
      <button class="fbtn" onclick="setFilter('warn')">Incompleto</button>
      <button class="fbtn" onclick="setFilter('bad')">No Disponible</button>
    </div>
  </div>

  <div class="results-info" id="results-info">Mostrando 0 de 0 items</div>
  <div class="items" id="items-grid"></div>
</div>

<script>
async function loadData() {
  try {
    const [items, cats, subs] = await Promise.all([
      fetch('/api/items').then(r => r.json()),
      fetch('/api/categories').then(r => r.json()),
      fetch('/api/categories/subcategories/all').then(r => r.json())
    ]);
    ALL_ITEMS = items || [];
    ALL_CATS = cats || [];
    ALL_SUBS = subs || [];
    
    updateDashboard(ALL_ITEMS);
    renderGrid(ALL_ITEMS);
  } catch (e) {
    console.error("Error loading data:", e);
  }
}

function updateDashboard(items) {
  const total = items.length;
  if (!total) return;

  const ok = items.filter(i => String(i.status || '').toLowerCase() === 'completo').length;
  const warn = items.filter(i => String(i.status || '').toLowerCase() === 'incompleto').length;
  const bad = items.filter(i => String(i.status || '').toLowerCase() === 'faltante').length;

  document.getElementById('header-subtitle').textContent = `MUNICIPIO - REVISION 2026 - ${total} ITEMS`;
  
  const metrics = document.getElementById('metrics');
  metrics.innerHTML = `
    <div class="metric"><div class="metric-num">${total}</div><div class="metric-label">Ítems Fiscalizados</div></div>
    <div class="metric ok"><div class="metric-num">${ok}</div><div class="metric-label">Completados</div></div>
    <div class="metric warn"><div class="metric-num">${warn}</div><div class="metric-label">Incompletos</div></div>
    <div class="metric bad"><div class="metric-num">${bad}</div><div class="metric-label">No Disponibles</div></div>
  `;

  const pOk = (ok / total) * 100;
  const pWarn = (warn / total) * 100;
  const pBad = (bad / total) * 100;

  document.getElementById('seg-ok').style.width = pOk + '%';
  document.getElementById('seg-warn').style.width = pWarn + '%';
  document.getElementById('seg-bad').style.width = pBad + '%';

  document.getElementById('gp-legend').innerHTML = `
    <div class="legend-item"><div class="legend-dot" style="background:var(--ok)"></div><span>Completado — ${ok} (${Math.round(pOk)}%)</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--warn)"></div><span>Incompleto — ${warn} (${Math.round(pWarn)}%)</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--bad)"></div><span>No disponible — ${bad} (${Math.round(pBad)}%)</span></div>
  `;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.toLowerCase().includes(f === 'all' ? 'todos' : (f==='ok'?'completado':(f==='warn'?'incompleto':'no disponible'))));
  });
  renderGrid(ALL_ITEMS);
}

function renderGrid(items) {
  const filtered = items.filter(i => {
    const s = String(i.status || '').toLowerCase();
    const matchF = currentFilter === 'all' || 
                   (currentFilter === 'ok' && s === 'completo') || 
                   (currentFilter === 'warn' && s === 'incompleto') || 
                   (currentFilter === 'bad' && s === 'faltante');
    const matchS = !searchQuery || i.name.toLowerCase().includes(searchQuery);
    return matchF && matchS;
  });

  document.getElementById('results-info').textContent = `Mostrando ${filtered.length} de ${items.length} items`;
  
  const grid = document.getElementById('items-grid');
  grid.innerHTML = filtered.map(i => {
    const s = String(i.status || '').toLowerCase();
    const statusCls = s === 'completo' ? 'ok' : (s === 'faltante' ? 'bad' : 'warn');
    const statusLabel = s === 'completo' ? 'COMPLETADO' : (s === 'faltante' ? 'NO DISPONIBLE' : 'INCOMPLETO');
    
    const cat = ALL_CATS.find(c => c._id === (i.category?._id || i.category));
    const sub = ALL_SUBS.find(s => s._id === (i.subcategory?._id || i.subcategory));

    return `
      <div class="item">
        <div class="item-content">
          <div class="item-name">${h(i.name)}</div>
          <div class="item-meta">
            ${cat ? h(cat.name) : ''} ${sub ? ' / ' + h(sub.name) : ''}
          </div>
        </div>
        <div class="item-status ${statusCls}">${statusLabel}</div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    `;
  }).join('');
}

function h(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase();
  renderGrid(ALL_ITEMS);
});

loadData();
</script>
</body>
</html>
