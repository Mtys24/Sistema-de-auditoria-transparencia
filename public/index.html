<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoria - Transparencia Activa Municipal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ok:#00c896;--ok-bg:#00c89615;--warn:#f5a623;--warn-bg:#f5a62315;--bad:#ff4d4d;--bad-bg:#ff4d4d15;--bg:#0c0e14;--surface:#13161f;--surface2:#1a1e2b;--border:#ffffff10;--border2:#ffffff20;--text:#eef0f8;--muted:#6e7491;--accent:#5b7fff;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:"DM Mono",monospace;min-height:100vh;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;}
  .wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:48px 24px 80px;}
  .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:48px;gap:24px;flex-wrap:wrap;}
  .header-left h1{font-family:"Syne",sans-serif;font-size:clamp(28px,5vw,48px);font-weight:800;line-height:1;letter-spacing:-1px;}
  .header-left h1 span{color:var(--accent);}
  .header-left p{margin-top:10px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .badge-org{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:10px 16px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
  .btn-login{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:8px 14px;font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);cursor:pointer;text-decoration:none;transition:all .2s;display:inline-block;}
  .btn-login:hover{border-color:var(--accent);color:var(--accent);}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:40px;}
  .metric{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:20px;position:relative;overflow:hidden;transition:border-color .2s;}
  .metric:hover{border-color:var(--accent);}
  .metric::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;}
  .metric.ok::after{background:var(--ok);}.metric.warn::after{background:var(--warn);}.metric.bad::after{background:var(--bad);}.metric.total::after{background:var(--accent);}
  .metric-num{font-family:"Syne",sans-serif;font-size:42px;font-weight:800;line-height:1;margin-bottom:6px;}
  .metric.ok .metric-num{color:var(--ok);}.metric.warn .metric-num{color:var(--warn);}.metric.bad .metric-num{color:var(--bad);}.metric.total .metric-num{color:var(--accent);}
  .metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .progress-bar{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:24px;margin-bottom:40px;}
  .progress-bar h2{font-family:"Syne",sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
  .bar-track{height:10px;background:var(--surface2);border-radius:10px;overflow:hidden;display:flex;margin-bottom:12px;}
  .bar-seg{height:100%;transition:width 1s cubic-bezier(.4,0,.2,1);}
  .bar-legend{display:flex;gap:24px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
  .legend-dot{width:8px;height:8px;border-radius:50%;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:14px;height:14px;}
  .search-input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:10px 12px 10px 36px;color:var(--text);font-family:"DM Mono",monospace;font-size:13px;outline:none;transition:border-color .2s;}
  .search-input:focus{border-color:var(--accent);}.search-input::placeholder{color:var(--muted);}
  .filter-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:8px 14px;font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .2s;}
  .btn:hover{color:var(--text);background:var(--surface2);}
  .btn.active-all{border-color:var(--accent);color:var(--accent);background:#5b7fff12;}
  .btn.active-ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);}
  .btn.active-warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg);}
  .btn.active-bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);}
  .results-count{font-size:11px;color:var(--muted);margin-bottom:14px;letter-spacing:.06em;text-transform:uppercase;}
  .items{display:flex;flex-direction:column;gap:6px;}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s,background .2s;animation:fadeIn .25s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .item:hover{border-color:var(--border2);}.item.open{border-color:var(--border2);background:var(--surface2);}
  .item-header{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;user-select:none;}
  .status-line{width:3px;height:20px;border-radius:2px;flex-shrink:0;}
  .item-name{flex:1;font-size:13px;color:var(--text);line-height:1.4;}
  .item-cat{font-size:10px;color:var(--muted);margin-top:2px;}
  .tag{font-size:10px;font-family:"DM Mono",monospace;padding:3px 10px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;flex-shrink:0;}
  .tag-ok{background:var(--ok-bg);color:var(--ok);border:1px solid #00c89630;}
  .tag-warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f5a62330;}
  .tag-bad{background:var(--bad-bg);color:var(--bad);border:1px solid #ff4d4d30;}
  .chevron{width:16px;height:16px;color:var(--muted);transition:transform .25s;flex-shrink:0;}
  .item.open .chevron{transform:rotate(180deg);}
  .item-body{display:none;padding:0 18px 16px 35px;font-size:12px;color:var(--muted);line-height:1.7;border-top:1px solid var(--border);}
  .item.open .item-body{display:block;}
  .areas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .area-pill{font-size:10px;background:var(--surface);border:1px solid var(--border2);border-radius:4px;padding:2px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .prev-obs{margin-top:10px;padding:10px 12px;background:#ff4d4d08;border-left:2px solid var(--bad);border-radius:0 4px 4px 0;font-size:11px;color:#ff4d4d80;}
  .prev-obs span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--bad);margin-bottom:4px;opacity:.7;}
  .no-results{text-align:center;padding:60px 0;font-size:13px;color:var(--muted);display:none;}
  .no-results.show{display:block;}
  .footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  @media(max-width:640px){.metrics{grid-template-columns:1fr 1fr;}.header-left h1{font-size:28px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-left">
      <h1>Auditoria<br><span>Transparencia</span></h1>
      <p id="header-sub">Municipio - Revision 2026</p>
    </div>
    <div class="header-right">
      <div class="badge-org">Consejo para la<br>Transparencia</div>
      <a class="btn-login" href="/login.html">Acceso auditor</a>
    </div>
  </div>
  <div class="metrics" id="metrics"></div>
  <div class="progress-bar">
    <h2>Cumplimiento global</h2>
    <div class="bar-track">
      <div class="bar-seg" id="seg-ok" style="background:var(--ok);width:0%"></div>
      <div class="bar-seg" id="seg-warn" style="background:var(--warn);width:0%"></div>
      <div class="bar-seg" id="seg-bad" style="background:var(--bad);width:0%"></div>
    </div>
    <div class="bar-legend" id="bar-legend"></div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="search" placeholder="Buscar item...">
    </div>
    <div class="filter-btns" id="filters"></div>
  </div>
  <div class="results-count" id="count"></div>
  <div class="items" id="grid"></div>
  <div class="no-results" id="no-results">Sin resultados para esa busqueda.</div>
  <div class="footer">
    <span>Auditoria de Transparencia Activa 2026</span>
    <span id="footer-date"></span>
  </div>
</div>
<script>
var ITEMS=[],activeFilter="all",searchVal="";
async function loadData(){try{ITEMS=await fetch("/api/items").then(function(r){return r.json();});}catch(e){ITEMS=[];}init();}
function init(){
  var total=ITEMS.length;
  var counts={ok:0,warn:0,bad:0};
  ITEMS.forEach(function(i){counts[i.status]=(counts[i.status]||0)+1;});
  document.getElementById("header-sub").textContent="Municipio - Revision 2026 - "+total+" items";
  var metricData=[{cls:"total",num:total,label:"Items fiscalizados"},{cls:"ok",num:counts.ok||0,label:"Completados"},{cls:"warn",num:counts.warn||0,label:"Incompletos"},{cls:"bad",num:counts.bad||0,label:"No disponibles"}];
  document.getElementById("metrics").innerHTML=metricData.map(function(m){return "<div class='metric "+m.cls+"'><div class='metric-num'>"+m.num+"</div><div class='metric-label'>"+m.label+"</div></div>";}).join("");
  setTimeout(function(){if(total){document.getElementById("seg-ok").style.width=(counts.ok/total*100).toFixed(1)+"%";document.getElementById("seg-warn").style.width=(counts.warn/total*100).toFixed(1)+"%";document.getElementById("seg-bad").style.width=(counts.bad/total*100).toFixed(1)+"%";}},100);
  document.getElementById("bar-legend").innerHTML=[{color:"var(--ok)",label:"Completado - "+(counts.ok||0)+" ("+(total?Math.round((counts.ok||0)/total*100):0)+"%)"},{color:"var(--warn)",label:"Incompleto - "+(counts.warn||0)+" ("+(total?Math.round((counts.warn||0)/total*100):0)+"%)"},{color:"var(--bad)",label:"No disponible - "+(counts.bad||0)+" ("+(total?Math.round((counts.bad||0)/total*100):0)+"%)"}].map(function(l){return "<div class='legend-item'><div class='legend-dot' style='background:"+l.color+"'></div><span>"+l.label+"</span></div>";}).join("");
  document.getElementById("footer-date").textContent=new Date().toLocaleDateString("es-CL",{year:"numeric",month:"long",day:"numeric"});
  renderAll();
}
var filterConfig=[{k:"all",label:"Todos",active:"active-all"},{k:"ok",label:"Completado",active:"active-ok"},{k:"warn",label:"Incompleto",active:"active-warn"},{k:"bad",label:"No disponible",active:"active-bad"}];
function renderFilters(){
  document.getElementById("filters").innerHTML=filterConfig.map(function(f){return "<button class='btn "+(activeFilter===f.k?f.active:"")+"' data-filter='"+f.k+"'>"+f.label+"</button>";}).join("");
  document.querySelectorAll("[data-filter]").forEach(function(btn){btn.addEventListener("click",function(){activeFilter=btn.dataset.filter;renderAll();});});
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderGrid(){
  var filtered=ITEMS.filter(function(item){return (activeFilter==="all"||item.status===activeFilter)&&(!searchVal||item.name.toLowerCase().indexOf(searchVal)>=0);});
  document.getElementById("count").textContent="Mostrando "+filtered.length+" de "+ITEMS.length+" items";
  var noRes=document.getElementById("no-results");
  if(!filtered.length){document.getElementById("grid").innerHTML="";noRes.classList.add("show");return;}
  noRes.classList.remove("show");
  document.getElementById("grid").innerHTML=filtered.map(function(item,i){
    var catLine = item.category ? "<div class='item-cat'>" + esc(item.category.name || "") + 
      (item.subcategory ? " / " + esc(item.subcategory.name || "") : "") + 
      (item.subSubcategory ? " / " + esc(item.subSubcategory.name || "") : "") + "</div>" : "";
    var prevObs=item.prev_observation?"<div class='prev-obs'><span>Observacion previa</span>"+esc(item.prev_observation)+"</div>":"";
    var areasHtml=(item.areas||[]).map(function(a){return "<span class='area-pill'>"+esc(a.name||a)+"</span>";}).join("");
    return "<div class='item' id='item-"+i+"' style='animation-delay:"+Math.min(i*.03,.3)+"s'><div class='item-header' onclick='toggle(\"item-"+i+"\")'><div class='status-line' style='background:var(--"+item.status+")'></div><div style='flex:1'><div class='item-name'>"+esc(item.name)+"</div>"+catLine+"</div><div class='tag tag-"+item.status+"'>"+esc(item.tag||item.status)+"</div><svg class='chevron' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg></div><div class='item-body'><div style='padding-top:12px'>"+esc(item.detail||"")+"</div>"+prevObs+"<div class='areas'>"+areasHtml+"</div></div></div>";
  }).join("");
}
function toggle(id){document.getElementById(id).classList.toggle("open");}
function renderAll(){renderFilters();renderGrid();}
document.getElementById("search").addEventListener("input",function(e){searchVal=e.target.value.toLowerCase();renderAll();});
loadData();
</script>
</body>
</html>
