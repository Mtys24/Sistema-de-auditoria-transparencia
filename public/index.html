<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría · Transparencia Activa Municipal</title>
<meta name="description" content="Dashboard de auditoría de transparencia activa municipal — revisión 2026">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ok: #34d399;
    --ok-bg: rgba(52,211,153,.08);
    --ok-glow: rgba(52,211,153,.25);
    --warn: #fbbf24;
    --warn-bg: rgba(251,191,36,.08);
    --warn-glow: rgba(251,191,36,.25);
    --bad: #f87171;
    --bad-bg: rgba(248,113,113,.08);
    --bad-glow: rgba(248,113,113,.25);
    --bg: #06080d;
    --surface: #0d1117;
    --surface2: #151b27;
    --surface3: #1c2333;
    --border: rgba(255,255,255,.06);
    --border2: rgba(255,255,255,.1);
    --border3: rgba(255,255,255,.15);
    --text: #e6edf3;
    --text2: #c9d1d9;
    --muted: #586069;
    --accent: #7c8aff;
    --accent2: #a78bfa;
    --accent-bg: rgba(124,138,255,.08);
    --accent-glow: rgba(124,138,255,.2);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: .25s cubic-bezier(.4,0,.2,1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient background effects */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 10%, rgba(124,138,255,.06), transparent),
      radial-gradient(ellipse 500px 350px at 80% 80%, rgba(167,139,250,.04), transparent);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: .4;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 28px 100px;
  }

  /* ─── CONNECTION STATUS ─── */
  .conn-status {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    backdrop-filter: blur(12px);
    transition: all var(--transition);
  }

  .conn-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: all var(--transition);
  }

  .conn-status.online .conn-dot {
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok-glow);
    animation: pulse-dot 2s infinite;
  }

  .conn-status.offline .conn-dot {
    background: var(--bad);
    box-shadow: 0 0 8px var(--bad-glow);
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
  }

  /* ─── HEADER ─── */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 44px;
    gap: 24px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
    color: var(--text);
  }

  .header-left h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-left p {
    margin-top: 12px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  
  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .badge-org {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 12px 18px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    backdrop-filter: blur(8px);
    transition: border-color var(--transition);
  }

  .badge-org:hover { border-color: var(--accent); }

  /* ─── EXPORT BUTTON ─── */
  .btn-export {
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(8px);
  }
  
  .btn-export:hover {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* ─── DEADLINES PANEL ─── */
  .deadlines-panel {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 32px;
    transition: border-color var(--transition);
  }

  .deadlines-panel:hover {
    border-color: var(--border3);
  }

  .deadlines-panel h2 {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .deadlines-panel h2 svg { color: var(--warn); }

  .deadlines-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .deadline-card {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .deadline-card.past-due {
    border-color: rgba(248,113,113,.3);
    background: rgba(248,113,113,.05);
  }
  
  .deadline-card.upcoming {
    border-color: rgba(251,191,36,.3);
    background: rgba(251,191,36,.05);
  }

  .deadline-info-date {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .deadline-info-status {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 4px;
  }
  
  .past-due .deadline-info-status { background: var(--bad-bg); color: var(--bad); }
  .upcoming .deadline-info-status { background: var(--warn-bg); color: var(--warn); }

  .deadline-stats {
    text-align: right;
  }
  
  .deadline-stats-num {
    font-size: 20px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    color: var(--bad);
  }
  
  .deadline-stats-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ─── METRICS ─── */
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: all var(--transition);
    cursor: default;
  }

  .metric::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    opacity: .8;
    transition: opacity var(--transition);
  }

  .metric::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity var(--transition);
    pointer-events: none;
  }

  .metric:hover { border-color: var(--border3); transform: translateY(-2px); }
  .metric:hover::before { opacity: 1; }
  .metric:hover::after { opacity: 1; }

  .metric.ok::before { background: linear-gradient(90deg, var(--ok), transparent); }
  .metric.ok::after { background: radial-gradient(ellipse at top left, var(--ok-bg), transparent 70%); }
  .metric.warn::before { background: linear-gradient(90deg, var(--warn), transparent); }
  .metric.warn::after { background: radial-gradient(ellipse at top left, var(--warn-bg), transparent 70%); }
  .metric.bad::before { background: linear-gradient(90deg, var(--bad), transparent); }
  .metric.bad::after { background: radial-gradient(ellipse at top left, var(--bad-bg), transparent 70%); }
  .metric.total::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .metric.total::after { background: radial-gradient(ellipse at top left, var(--accent-bg), transparent 70%); }

  .metric-num {
    font-family: 'Syne', sans-serif;
    font-size: 44px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }

  .metric.ok .metric-num { color: var(--ok); }
  .metric.warn .metric-num { color: var(--warn); }
  .metric.bad .metric-num { color: var(--bad); }
  .metric.total .metric-num { color: var(--accent); }

  .metric-label {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    position: relative;
    z-index: 1;
  }

  .metric-pct {
    position: absolute;
    bottom: 14px;
    right: 18px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    opacity: .6;
    z-index: 1;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-section {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 32px;
    transition: border-color var(--transition);
  }

  .progress-section:hover { border-color: var(--border3); }

  .progress-section h2 {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .bar-track {
    height: 8px;
    background: var(--surface3);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    margin-bottom: 16px;
  }

  .bar-seg {
    height: 100%;
    transition: width 1.2s cubic-bezier(.4,0,.2,1);
    position: relative;
  }

  .bar-seg:first-child { border-radius: 10px 0 0 10px; }
  .bar-seg:last-child { border-radius: 0 10px 10px 0; }

  .bar-legend {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ─── CONTROLS & FILTERS ─── */
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    width: 15px;
    height: 15px;
    transition: color var(--transition);
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 11px 14px 11px 40px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: all var(--transition);
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }

  .search-input:focus + svg,
  .search-wrap:focus-within svg { color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .filter-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    align-items: flex-start;
  }

  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-content: flex-start;
  }

  .filter-group-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0 4px;
    width: 100%;
    margin-bottom: 4px;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transition: all var(--transition);
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--border3);
    color: var(--text2);
    background: var(--surface2);
    transform: translateY(-1px);
  }

  .btn.active-all { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 12px rgba(124,138,255,.1); }
  .btn.active-ok { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); box-shadow: 0 0 12px rgba(52,211,153,.1); }
  .btn.active-warn { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); box-shadow: 0 0 12px rgba(251,191,36,.1); }
  .btn.active-bad { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); box-shadow: 0 0 12px rgba(248,113,113,.1); }
  .btn.active-area, .btn.active-section { border-color: var(--accent2); color: var(--accent2); background: rgba(167,139,250,.08); box-shadow: 0 0 12px rgba(167,139,250,.1); }

  /* ─── SECTION GROUPS ─── */
  .section-group {
    margin-bottom: 32px;
    animation: fadeSlideIn .35s cubic-bezier(.4,0,.2,1) both;
  }
  
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  
  .section-header h3 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  
  .section-header h3 span {
    color: var(--accent);
    margin-right: 6px;
    font-family: 'DM Mono', monospace;
  }
  
  .section-progress {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    background: var(--surface2);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border2);
  }
  
  .section-progress span {
    color: var(--text);
  }

  /* ─── ITEMS ─── */
  .items { display: flex; flex-direction: column; gap: 6px; }

  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all var(--transition);
  }

  .item:hover { border-color: var(--border2); }
  .item.open { border-color: var(--border3); background: var(--surface2); }

  .item-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
    transition: background var(--transition);
  }

  .item-header:hover { background: rgba(255,255,255,.015); }

  .status-line {
    width: 3px;
    height: 22px;
    border-radius: 2px;
    flex-shrink: 0;
    transition: box-shadow var(--transition);
  }

  .item:hover .status-line.sl-ok { box-shadow: 0 0 8px var(--ok-glow); }
  .item:hover .status-line.sl-warn { box-shadow: 0 0 8px var(--warn-glow); }
  .item:hover .status-line.sl-bad { box-shadow: 0 0 8px var(--bad-glow); }

  .item-id {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    opacity: .5;
    flex-shrink: 0;
    min-width: 28px;
  }

  .item-name {
    flex: 1;
    font-size: 13px;
    font-weight: 450;
    color: var(--text2);
    line-height: 1.4;
  }

  .dl-badge {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    margin-right: 8px;
  }
  
  .dl-badge.past-due {
    background: rgba(248,113,113,.15);
    color: #ff8f8f;
    border: 1px solid rgba(248,113,113,.3);
  }
  
  .dl-badge.upcoming {
    background: rgba(251,191,36,.15);
    color: #ffd166;
    border: 1px solid rgba(251,191,36,.3);
  }

  .item-areas-preview {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .area-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent2);
    opacity: .4;
  }

  .tag {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    padding: 4px 10px;
    border-radius: 5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tag-ok   { background: var(--ok-bg);   color: var(--ok);   border: 1px solid rgba(52,211,153,.2); }
  .tag-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(251,191,36,.2); }
  .tag-bad  { background: var(--bad-bg);  color: var(--bad);  border: 1px solid rgba(248,113,113,.2); }

  .chevron {
    width: 16px;
    height: 16px;
    color: var(--muted);
    transition: transform var(--transition), color var(--transition);
    flex-shrink: 0;
  }

  .item.open .chevron { transform: rotate(180deg); color: var(--accent); }

  .item-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .4s cubic-bezier(.4,0,.2,1), padding .3s;
    padding: 0 20px 0 55px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.7;
    border-top: 1px solid transparent;
  }

  .item.open .item-body {
    max-height: 800px;
    padding: 0 20px 20px 55px;
    border-top-color: var(--border);
  }

  .item-body-inner { padding-top: 16px; }

  .detail-text {
    margin-bottom: 12px;
    color: var(--text2);
    font-size: 13px;
    line-height: 1.7;
  }

  .areas {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .area-pill {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    background: var(--surface3);
    border: 1px solid var(--border2);
    border-radius: 5px;
    padding: 3px 10px;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transition: all var(--transition);
  }

  .area-pill:hover { border-color: var(--accent2); background: rgba(167,139,250,.08); }

  .prev-obs {
    margin-top: 14px;
    padding: 14px 16px;
    background: rgba(248,113,113,.04);
    border-left: 2px solid var(--bad);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-size: 12px;
    color: rgba(248,113,113,.7);
    line-height: 1.6;
  }

  .prev-obs span {
    display: block;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--bad);
    margin-bottom: 6px;
    opacity: .8;
  }

  .item-meta {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    align-items: center;
    flex-wrap: wrap;
  }

  .item-meta-tag {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ─── STATUS EDITOR ─── */
  .status-editor {
    margin-top: 16px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    transition: all var(--transition);
  }

  .status-editor-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-editor-label svg {
    width: 12px;
    height: 12px;
  }

  .status-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .status-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all var(--transition);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--muted);
  }

  .status-btn:hover {
    transform: translateY(-1px);
  }

  .status-btn.sb-ok:hover, .status-btn.sb-ok.sb-active {
    border-color: var(--ok);
    color: var(--ok);
    background: var(--ok-bg);
    box-shadow: 0 0 16px rgba(52,211,153,.15);
  }

  .status-btn.sb-warn:hover, .status-btn.sb-warn.sb-active {
    border-color: var(--warn);
    color: var(--warn);
    background: var(--warn-bg);
    box-shadow: 0 0 16px rgba(251,191,36,.15);
  }

  .status-btn.sb-bad:hover, .status-btn.sb-bad.sb-active {
    border-color: var(--bad);
    color: var(--bad);
    background: var(--bad-bg);
    box-shadow: 0 0 16px rgba(248,113,113,.15);
  }

  .status-btn .sb-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-btn.sb-ok .sb-dot { background: var(--ok); }
  .status-btn.sb-warn .sb-dot { background: var(--warn); }
  .status-btn.sb-bad .sb-dot { background: var(--bad); }

  .status-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none !important;
  }

  .status-btn.sb-saving::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 6px;
    border: 2px solid transparent;
    border-top-color: currentColor;
    animation: spin .6s linear infinite;
  }

  /* ─── TOAST ─── */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toastIn .35s cubic-bezier(.4,0,.2,1) both;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
    max-width: 360px;
  }

  .toast.toast-ok { border-color: rgba(52,211,153,.3); }
  .toast.toast-bad { border-color: rgba(248,113,113,.3); }

  .toast-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .toast.toast-ok .toast-dot { background: var(--ok); }
  .toast.toast-bad .toast-dot { background: var(--bad); }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px) scale(.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-8px) scale(.95); }
  }

  .no-results {
    text-align: center;
    padding: 80px 0;
    font-size: 14px;
    color: var(--muted);
    display: none;
  }

  .no-results.show { display: block; }

  .no-results svg {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
    opacity: .3;
  }

  .loading-overlay {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 0;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  @media (max-width: 768px) {
    .metrics { grid-template-columns: 1fr 1fr; }
    .header-left h1 { font-size: 32px; }
    .filter-row { flex-direction: column; gap: 12px; }
    .controls { flex-direction: column; }
    .search-wrap { min-width: 100%; }
  }

  @media (max-width: 480px) {
    .metrics { grid-template-columns: 1fr; }
    .wrap { padding: 24px 16px 60px; }
    .item-header { padding: 12px 14px; gap: 10px; }
    .item-areas-preview { display: none; }
    .deadlines-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="conn-status" id="conn-status">
  <div class="conn-dot"></div>
  <span id="conn-text">Conectando...</span>
</div>

<div class="wrap">

  <div class="header">
    <div class="header-left">
      <h1>Auditoría<br><span>Transparencia</span></h1>
      <p id="header-subtitle">Municipio · Revisión 2026 · Cargando...</p>
    </div>
    <div class="header-actions">
      <button class="btn-export" onclick="exportSummary()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Copiar Resumen
      </button>
      <div class="badge-org">Consejo para la<br>Transparencia</div>
    </div>
  </div>

  <div id="deadlines-container"></div>

  <div class="metrics" id="metrics"></div>

  <div class="progress-section">
    <h2>Cumplimiento global</h2>
    <div class="bar-track" id="bar-track">
      <div class="bar-seg" id="seg-ok"   style="background:var(--ok);width:0%"></div>
      <div class="bar-seg" id="seg-warn" style="background:var(--warn);width:0%"></div>
      <div class="bar-seg" id="seg-bad"  style="background:var(--bad);width:0%"></div>
    </div>
    <div class="bar-legend" id="bar-legend"></div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="search" placeholder="Buscar ítem de auditoría...">
    </div>
  </div>

  <div class="filter-row">
    <div class="filter-group">
      <div class="filter-group-label">Estado</div>
      <div id="filters-status"></div>
    </div>
    <div class="filter-group">
      <div class="filter-group-label">Sección</div>
      <div id="filters-section"></div>
    </div>
    <div class="filter-group">
      <div class="filter-group-label">Área</div>
      <div id="filters-area"></div>
    </div>
  </div>

  <div class="results-count" id="count"></div>
  <div id="groups"></div>
  
  <div class="no-results" id="no-results">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6"/></svg>
    <div>Sin resultados para esa búsqueda.</div>
  </div>

  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div class="footer">
    <span>Auditoría de Transparencia Activa · 2026</span>
    <span>SQLite · API REST</span>
    <span id="footer-date"></span>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
const API = window.location.origin + '/api';

// ─── STATE ────────────────────────────────────────
let state = {
  items: [],
  stats: { total: 0, ok: 0, warn: 0, bad: 0 },
  areas: [],
  sections: [],
  deadlines: [],
  activeStatus: 'all',
  activeArea: 'all',
  activeSection: 'all',
  search: '',
  connected: false
};

// ─── API CALLS ────────────────────────────────────
async function fetchItems() {
  const params = new URLSearchParams();
  if (state.activeStatus !== 'all') params.set('status', state.activeStatus);
  if (state.activeArea !== 'all') params.set('area', state.activeArea);
  if (state.activeSection !== 'all') params.set('section', state.activeSection);
  if (state.search) params.set('search', state.search);

  const res = await fetch(`${API}/items?${params}`);
  return res.json();
}

async function fetchStats() {
  const params = new URLSearchParams();
  if (state.activeArea !== 'all') params.set('area', state.activeArea);
  if (state.activeSection !== 'all') params.set('section', state.activeSection);

  const res = await fetch(`${API}/stats?${params}`);
  return res.json();
}

async function fetchAreas() {
  const res = await fetch(`${API}/areas`);
  return res.json();
}

async function fetchSections() {
  const res = await fetch(`${API}/sections`);
  return res.json();
}

async function fetchDeadlines() {
  const res = await fetch(`${API}/deadlines`);
  return res.json();
}

function setConnStatus(online) {
  const el = document.getElementById('conn-status');
  const text = document.getElementById('conn-text');
  state.connected = online;
  el.classList.toggle('online', online);
  el.classList.toggle('offline', !online);
  text.textContent = online ? 'SQLite conectado' : 'Sin conexión';
}

function renderDeadlines() {
  const container = document.getElementById('deadlines-container');
  if (!state.deadlines || state.deadlines.length === 0) {
    container.innerHTML = '';
    return;
  }

  const todayStr = new Date().toISOString().split('T')[0];
  
  const cardsHtml = state.deadlines.map(dl => {
    const isPastDue = dl.deadline < todayStr;
    const cls = isPastDue ? 'past-due' : 'upcoming';
    const rawDate = new Date(dl.deadline + 'T00:00:00');
    // For formatting properly
    const fmtDate = rawDate.toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' });
    
    return `
      <div class="deadline-card ${cls}">
        <div class="deadline-info">
          <div class="deadline-info-date">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            ${fmtDate}
          </div>
          <span class="deadline-info-status">${isPastDue ? 'Vencido o Hoy' : 'Próximo'}</span>
        </div>
        <div class="deadline-stats">
          <div class="deadline-stats-num">${dl.pending}</div>
          <div class="deadline-stats-label">Ítems pendientes</div>
        </div>
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="deadlines-panel">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Plazos de cumplimiento</h2>
      <div class="deadlines-grid">${cardsHtml}</div>
    </div>
  `;
}

function renderMetrics() {
  const s = state.stats;
  const data = [
    { cls: 'total', num: s.total, label: 'Ítems fiscalizados', pct: '100%' },
    { cls: 'ok',    num: s.ok,    label: 'Completados',        pct: s.total ? Math.round(s.ok / s.total * 100) + '%' : '0%' },
    { cls: 'warn',  num: s.warn,  label: 'Incompletos',        pct: s.total ? Math.round(s.warn / s.total * 100) + '%' : '0%' },
    { cls: 'bad',   num: s.bad,   label: 'No disponibles',     pct: s.total ? Math.round(s.bad / s.total * 100) + '%' : '0%' }
  ];

  document.getElementById('metrics').innerHTML = data.map(m => `
    <div class="metric ${m.cls}">
      <div class="metric-num">${m.num}</div>
      <div class="metric-label">${m.label}</div>
      <div class="metric-pct">${m.pct}</div>
    </div>
  `).join('');
}

function renderProgressBar() {
  const s = state.stats;
  if (!s.total) return;

  setTimeout(() => {
    document.getElementById('seg-ok').style.width   = (s.ok / s.total * 100).toFixed(1) + '%';
    document.getElementById('seg-warn').style.width = (s.warn / s.total * 100).toFixed(1) + '%';
    document.getElementById('seg-bad').style.width  = (s.bad / s.total * 100).toFixed(1) + '%';
  }, 100);

  document.getElementById('bar-legend').innerHTML = [
    { color: 'var(--ok)',   label: `Completado — ${s.ok} (${Math.round(s.ok/s.total*100)}%)` },
    { color: 'var(--warn)', label: `Incompleto — ${s.warn} (${Math.round(s.warn/s.total*100)}%)` },
    { color: 'var(--bad)',  label: `No disponible — ${s.bad} (${Math.round(s.bad/s.total*100)}%)` }
  ].map(l => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${l.color}"></div>
      <span>${l.label}</span>
    </div>
  `).join('');
}

function renderStatusFilters() {
  const config = [
    { k: 'all',  label: 'Todos',          active: 'active-all' },
    { k: 'ok',   label: 'Completado',     active: 'active-ok' },
    { k: 'warn', label: 'Incompleto',     active: 'active-warn' },
    { k: 'bad',  label: 'No disponible',  active: 'active-bad' }
  ];

  const container = document.getElementById('filters-status');
  container.innerHTML = config.map(f =>
    `<button class="btn ${state.activeStatus === f.k ? f.active : ''}" data-status="${f.k}">${f.label}</button>`
  ).join('');

  container.querySelectorAll('[data-status]').forEach(btn =>
    btn.addEventListener('click', () => {
      state.activeStatus = btn.dataset.status;
      refreshAll();
    })
  );
}

function renderSectionFilters() {
  const container = document.getElementById('filters-section');
  const sections = [{ section: 'all', section_name: 'Todas' }, ...state.sections];

  container.innerHTML = sections.map(s => {
    const k = s.section;
    const isActive = state.activeSection === k;
    const lbl = k === 'all' ? 'Todas' : `${k}. ${s.section_name}`;
    return `<button class="btn ${isActive ? 'active-section' : ''}" data-section="${k}">${lbl}</button>`;
  }).join('');

  container.querySelectorAll('[data-section]').forEach(btn =>
    btn.addEventListener('click', () => {
      state.activeSection = btn.dataset.section;
      refreshAll();
    })
  );
}

function renderAreaFilters() {
  const container = document.getElementById('filters-area');
  const areas = [{ name: 'Todas' }, ...state.areas];

  container.innerHTML = areas.map(a => {
    const k = a.name === 'Todas' ? 'all' : a.name;
    const isActive = state.activeArea === k;
    return `<button class="btn ${isActive ? 'active-area' : ''}" data-area="${k}">${a.name === 'Todas' ? 'Todas' : a.name}</button>`;
  }).join('');

  container.querySelectorAll('[data-area]').forEach(btn =>
    btn.addEventListener('click', () => {
      state.activeArea = btn.dataset.area;
      refreshAll();
    })
  );
}

function renderGroups() {
  const items = state.items;
  const total = state.stats.total;
  const countEl = document.getElementById('count');
  const noRes = document.getElementById('no-results');
  const groupsContainer = document.getElementById('groups');

  countEl.innerHTML = `Mostrando ${items.length} de ${total} ítems <span class="db-badge">SQLite</span>`;

  if (items.length === 0) {
    groupsContainer.innerHTML = '';
    noRes.classList.add('show');
    return;
  }
  noRes.classList.remove('show');

  // Group items
  const grouped = {};
  for (const item of items) {
    const key = item.section + '|' + item.section_name;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(item);
  }

  const todayStr = new Date().toISOString().split('T')[0];

  let html = '';
  Object.keys(grouped).sort().forEach((key, gIdx) => {
    const [sec, secName] = key.split('|');
    const groupItems = grouped[key];
    const groupOk = groupItems.filter(i => i.status === 'ok').length;
    
    html += `
      <div class="section-group" style="animation-delay:${Math.min(gIdx * 0.05, 0.3)}s">
        <div class="section-header">
          <h3><span>${sec}.</span> ${secName}</h3>
          <div class="section-progress"><span>${groupOk}</span> / ${groupItems.length} completados</div>
        </div>
        <div class="items">
    `;

    html += groupItems.map((item, i) => {
      let deadlineBadge = '';
      if (item.deadline && item.status !== 'ok') {
        const isPastDue = item.deadline < todayStr;
        const cls = isPastDue ? 'past-due' : 'upcoming';
        const rawDate = new Date(item.deadline + 'T00:00:00');
        const fmtDate = rawDate.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
        deadlineBadge = `<div class="dl-badge ${cls}">${isPastDue ? 'Vencido' : 'Plazo:'} ${fmtDate}</div>`;
      }

      return `
        <div class="item" id="item-${item.id}">
          <div class="item-header" onclick="toggle('item-${item.id}')">
            <div class="status-line sl-${item.status}" style="background:var(--${item.status})"></div>
            <div class="item-id">#${item.id}</div>
            <div class="item-name">${item.name}</div>
            ${deadlineBadge}
            <div class="item-areas-preview">${item.areas.map(() => '<div class="area-dot"></div>').join('')}</div>
            <div class="tag tag-${item.status}">${item.tag}</div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="item-body">
            <div class="item-body-inner">
              <div class="detail-text">${item.detail}</div>
              ${item.prev_observation ? `<div class="prev-obs"><span>⚠ Observación auditoría anterior</span>${item.prev_observation}</div>` : ''}
              <div class="areas">${item.areas.map(a => `<span class="area-pill">${a}</span>`).join('')}</div>
              <div class="status-editor">
                <div class="status-editor-label">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  Cambiar estado
                </div>
                <div class="status-btns" id="status-btns-${item.id}">
                  <button class="status-btn sb-ok ${item.status === 'ok' ? 'sb-active' : ''}" onclick="event.stopPropagation(); changeStatus(${item.id}, 'ok', 'Completado')">
                    <div class="sb-dot"></div> Completado
                  </button>
                  <button class="status-btn sb-warn ${item.status === 'warn' ? 'sb-active' : ''}" onclick="event.stopPropagation(); changeStatus(${item.id}, 'warn', 'Incompleto')">
                    <div class="sb-dot"></div> Incompleto
                  </button>
                  <button class="status-btn sb-bad ${item.status === 'bad' ? 'sb-active' : ''}" onclick="event.stopPropagation(); changeStatus(${item.id}, 'bad', 'No disponible')">
                    <div class="sb-dot"></div> No disponible
                  </button>
                </div>
              </div>
              <div class="item-meta">
                <div class="item-meta-tag">ID: ${item.id}</div>
                ${item.updated_at ? `<div class="item-meta-tag">Actualizado: ${new Date(item.updated_at).toLocaleDateString('es-CL')}</div>` : ''}
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    html += `</div></div>`; // End .items and .section-group
  });

  groupsContainer.innerHTML = html;
}

function toggle(id) {
  document.getElementById(id).classList.toggle('open');
}

async function changeStatus(itemId, newStatus, tagLabel) {
  const btnsContainer = document.getElementById(`status-btns-${itemId}`);
  const allBtns = btnsContainer.querySelectorAll('.status-btn');
  allBtns.forEach(btn => {
    btn.disabled = true;
    if (btn.classList.contains(`sb-${newStatus}`)) btn.classList.add('sb-saving');
  });

  try {
    const res = await fetch(`${API}/items/${itemId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus, tag: tagLabel })
    });
    if (!res.ok) throw new Error('Failed to update');
    showToast(`#${itemId} actualizado a "${tagLabel}"`, 'ok');
    await refreshAll();
    setTimeout(() => { const el = document.getElementById(`item-${itemId}`); if (el) el.classList.add('open'); }, 50);
  } catch (err) {
    showToast('Error al actualizar el estado', 'bad');
    allBtns.forEach(btn => { btn.disabled = false; btn.classList.remove('sb-saving'); });
  }
}

function exportSummary() {
  const pending = state.items.filter(i => i.status !== 'ok');
  if (pending.length === 0) {
    showToast('No hay ítems pendientes para exportar', 'warn');
    return;
  }
  
  let text = 'ESTADO DE LA AUDITORÍA DE TRANSPARENCIA (Pendientes)\n';
  text += '-----------------------------------------------------\n\n';

  const grouped = {};
  for (const item of pending) {
    const key = item.section + '. ' + item.section_name;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(item);
  }

  for (const [sec, items] of Object.entries(grouped)) {
    text += `${sec}:\n`;
    for (const item of items) {
      text += `  - ${item.name} (${item.areas.join(', ')}) [Estado: ${item.tag}]\n`;
    }
    text += '\n';
  }

  navigator.clipboard.writeText(text).then(() => {
    showToast('Resumen copiado al portapapeles', 'ok');
  }).catch(err => {
    showToast('Error al copiar al portapapeles', 'bad');
  });
}

function showToast(message, type = 'ok') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `<div class="toast-dot"></div><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'toastOut .3s cubic-bezier(.4,0,.2,1) forwards';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

async function refreshAll() {
  try {
    const [items, stats, sections, deadlines] = await Promise.all([
      fetchItems(), fetchStats(), fetchSections(), fetchDeadlines()
    ]);
    state.items = items;
    state.stats = stats;
    state.sections = sections;
    state.deadlines = deadlines;

    renderDeadlines();
    renderMetrics();
    renderProgressBar();
    renderStatusFilters();
    renderSectionFilters();
    renderAreaFilters();
    renderGroups();

    document.getElementById('header-subtitle').textContent = `Municipio · Revisión 2026 · ${stats.total} ítems`;
    document.getElementById('loading').style.display = 'none';
  } catch (err) {
    setConnStatus(false);
  }
}

async function init() {
  try {
    state.areas = await fetchAreas();
    setConnStatus(true);
    await refreshAll();
  } catch (err) {
    setConnStatus(false);
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;color:var(--bad)">
        <div style="font-size:14px;margin-bottom:8px">Error de conexión</div>
        <div style="font-size:12px;color:var(--muted)">No se pudo conectar al servidor.</div>
        <button onclick="init()" class="btn" style="margin-top:16px">Reintentar</button>
      </div>
    `;
  }
}

document.getElementById('search').addEventListener('input', debounce(e => {
  state.search = e.target.value;
  refreshAll();
}, 250));

document.getElementById('footer-date').textContent = new Date().toLocaleDateString('es-CL', { year: 'numeric', month: 'long', day: 'numeric' });

init();
</script>
</body>
</html>
